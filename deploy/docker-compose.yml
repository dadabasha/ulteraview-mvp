services:
  signaling:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
    ports:
      - "8787:8787"

  turn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    command:
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_REALM}
      - --user=${TURN_USER}:${TURN_PASSWORD}
      - --no-cli
      - --no-tls
      - --no-dtls
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
